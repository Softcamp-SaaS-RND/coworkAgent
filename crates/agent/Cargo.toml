[package]
name = "an-agent"
version = "1.3.3"
edition = "2024"

[lib]
name = "an_agent"

[dependencies]
an-core = { path = "../core" }
an-net = { path = "../net" }
getrandom = "0.4.3"
log = "0.4.34"
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
ring = "0.17.14"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"] }
