[package]
name = "an-net"
version = "0.5.0"
edition = "2024"

[lib]
name = "an_net"

[dependencies]
an-core = { path = "../core" }
log = "0.4.34"
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
