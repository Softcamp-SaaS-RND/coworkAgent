[package]
name = "coworkagent-app"
version = "1.3.3"
edition = "2024"

[lib]
name = "an_app"

[[bin]]
name = "coworkAgent"
path = "src/main.rs"

[dependencies]
an-agent = { path = "../agent" }
an-core = { path = "../core" }
an-net = { path = "../net" }
axum = "0.8.9"
getrandom = "0.4.3"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tao = "0.37.1"
futures-util = { version = "0.3.34", default-features = false }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tray-icon = "0.26.1"
# 자동 업데이트(#30) — 받기만. TLS 인증서 확인 = OS 저장소(사내 TLS 검사 뒤에서도).
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["io-util"] }
